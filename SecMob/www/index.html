<!-- www/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecMob - Mobile Money App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/index.css">
    <style>
        /* Custom styles can be added here or in index.css */
        body {
            background-color: #f8f9fa;
        }
        .logo {
            max-width: 150px;
            margin-bottom: 20px;
        }
        .fingerprint-button {
            font-size: 1.2rem;
            padding: 15px 30px;
            border: 2px solid #6c757d;
            border-radius: 50px;
            background-color: #fff;
            color: #6c757d;
            transition: all 0.3s ease;
        }
        .fingerprint-button:hover {
            background-color: #6c757d;
            color: #fff;
        }
        .container {
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <!-- Main Container -->
    <div class="container text-center">
        <!-- Logo -->
        <img src="img/logo.png" alt="SecMob Logo" class="logo" />
        <!-- Welcome Message -->
        <h1 class="mb-3">Welcome to SecMob</h1>
        <p class="lead mb-5">Secure Mobile Money Transactions</p>
        <!-- Navigation Buttons -->
        <div class="d-grid gap-3 col-6 mx-auto mb-4">
            <a href="create_account.html" class="btn btn-primary btn-lg">Register</a>
            <a href="login.html" class="btn btn-success btn-lg">Login</a>
            <!-- Optional Exit Button -->
            <!-- 
            <button class="btn btn-danger btn-lg" onclick="navigator.app.exitApp();">Exit</button> 
            -->
        </div>
    </div>

    <!-- Fingerprint Authentication Container -->
    <div class="container text-center">
        <button id="fingerprint-button" class="fingerprint-button">
            <i class="fas fa-fingerprint me-2"></i> Scan Fingerprint
        </button>
    </div>

    <!-- Fingerprint Result Modal -->
    <div class="modal fade" id="fingerprintModal" tabindex="-1" aria-labelledby="fingerprintModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Fingerprint Authentication</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="fingerprintResult">
                    <!-- Authentication result will be displayed here -->
                    <p>Authenticating...</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Cordova Script -->
    <script src="cordova.js"></script>
    <!-- Custom JavaScript -->
    <script src="js/scripts.js"></script>
    <!-- <script src="js/fingerprint.js"></script> -->
    <script>
        document.addEventListener('DOMContentLoaded', initializeFingerprintAuth);
    </script>
    
</body>
</html>
