<!-- www/reset_pin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset PIN - Secure Mobile Money Services</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container mt-5">
        <h2>Reset PIN</h2>
        <form id="resetPinForm">
            <div class="mb-3">
                <label for="resetPhoneNumber" class="form-label">Mobile Money Phone Number</label>
                <input type="text" class="form-control" id="resetPhoneNumber" placeholder="e.g., 0771234567" required>
            </div>
            <div class="mb-3">
                <label for="resetEmail" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="resetEmail" placeholder="e.g., user@example.com" required>
            </div>
            <hr>
            <h4>Answer Security Questions</h4>
            <div class="mb-3">
                <label for="resetQuestion1" class="form-label">Security Question 1</label>
                <input type="text" class="form-control" id="resetQuestion1" required>
                <label for="resetAnswer1" class="form-label mt-2">Answer</label>
                <input type="text" class="form-control" id="resetAnswer1" required>
            </div>
            <div class="mb-3">
                <label for="resetQuestion2" class="form-label">Security Question 2</label>
                <input type="text" class="form-control" id="resetQuestion2" required>
                <label for="resetAnswer2" class="form-label mt-2">Answer</label>
                <input type="text" class="form-control" id="resetAnswer2" required>
            </div>
            <div class="mb-3">
                <label for="resetQuestion3" class="form-label">Security Question 3</label>
                <input type="text" class="form-control" id="resetQuestion3" required>
                <label for="resetAnswer3" class="form-label mt-2">Answer</label>
                <input type="text" class="form-control" id="resetAnswer3" required>
            </div>
            <div class="mb-3">
                <label for="newPin" class="form-label">New 4-digit PIN</label>
                <input type="password" class="form-control" id="newPin" maxlength="4" required>
            </div>
            <button type="submit" class="btn btn-warning">Reset PIN</button>
            <a href="index.html" class="btn btn-secondary">Cancel</a>
        </form>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Cordova JS -->
    <script src="cordova.js"></script>
    <!-- Custom JS -->
    <script src="js/scripts.js"></script>
</body>
</html>
